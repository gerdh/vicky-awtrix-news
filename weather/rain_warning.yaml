# Vicky 8 - AWTRIX rain warning for Billiat
# Uses the shared Vicky language state exposed by MQTT Discovery as
# sensor.vicky_language. Falls back to German if the sensor is unavailable.

- id: '1787248345937'
  alias: AWTRIX Regenwarnung Billiat
  description: Météo-France rain forecast on AWTRIX in the selected Vicky language
  triggers:
    - trigger: time_pattern
      minutes: /5

  actions:
    - variables:
        forecast: >-
          {{ state_attr(
            'sensor.meteo_france_rain_for_city_billiat_rhone_alpes_01_fr_billiat_next_rain',
            '1_hour_forecast'
          ) or {} }}

        rain_minutes: >-
          {% set ns = namespace(minutes='') %}
          {% for key, value in forecast.items() %}
            {% if ns.minutes == '' and value in ['Pluie faible', 'Pluie modérée', 'Pluie forte'] %}
              {% set ns.minutes = key | replace(' min','') %}
            {% endif %}
          {% endfor %}
          {{ ns.minutes }}

        rain_type: >-
          {% set ns = namespace(type='') %}
          {% for key, value in forecast.items() %}
            {% if ns.type == '' and value in ['Pluie faible', 'Pluie modérée', 'Pluie forte'] %}
              {% set ns.type = value %}
            {% endif %}
          {% endfor %}
          {{ ns.type }}

        vicky_language: >-
          {% set lang = states('sensor.vicky_language') | lower | trim %}
          {{ lang if lang in ['de', 'en', 'fr'] else 'de' }}

        rain_text: >-
          {% set mins = rain_minutes | int(0) %}
          {% set kind = rain_type | trim %}
          {% if vicky_language == 'fr' %}
            {% if mins == 0 %}
              Pluie maintenant
            {% elif kind == 'Pluie forte' %}
              Forte pluie dans {{ mins }} min.
            {% elif kind == 'Pluie modérée' %}
              Pluie dans {{ mins }} min.
            {% else %}
              Pluie faible dans {{ mins }} min.
            {% endif %}
          {% elif vicky_language == 'en' %}
            {% if mins == 0 %}
              Rain now
            {% elif kind == 'Pluie forte' %}
              Heavy rain in {{ mins }} min.
            {% elif kind == 'Pluie modérée' %}
              Rain in {{ mins }} min.
            {% else %}
              Light rain in {{ mins }} min.
            {% endif %}
          {% else %}
            {% if mins == 0 %}
              Regen jetzt
            {% elif kind == 'Pluie forte' %}
              Starker Regen in {{ mins }} Min.
            {% elif kind == 'Pluie modérée' %}
              Regen in {{ mins }} Min.
            {% else %}
              Leichter Regen in {{ mins }} Min.
            {% endif %}
          {% endif %}

    - choose:
        - conditions:
            - condition: template
              value_template: "{{ rain_minutes | trim != '' }}"
          sequence:
            - action: mqtt.publish
              data:
                topic: awtrix_3e6014/custom/rain
                payload: >-
                  {
                    "text": {{ rain_text | trim | tojson }},
                    "duration": 10,
                    "color": "FF0000"
                  }
      default:
        - action: mqtt.publish
          data:
            topic: awtrix_3e6014/custom/rain
            payload: ''

  mode: restart
